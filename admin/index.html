<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script>
      if (location.hostname === "rolcc.in") {
        location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
      }
    </script>
    <title>Article Composer | River of Life Christian Church</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-page">
    <div id="nc-root"></div>
    <p id="cms-error" class="admin-error" role="alert" hidden></p>
    <noscript>
      <p class="admin-error">Enable JavaScript to use the article composer.</p>
    </noscript>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.3.0/dist/decap-cms.js"></script>
    <script src="/admin/admin-composer.js"></script>
    <script>
      (function () {
        var errorBox = document.getElementById("cms-error");

        function showError(message) {
          if (!errorBox) return;
          errorBox.hidden = false;
          errorBox.textContent = message;
        }

        if (location.pathname === "/admin" || location.pathname === "/admin/") {
          location.replace("/admin/index.html" + location.search + location.hash);
          return;
        }

        if (location.hostname === "rolcc.in") {
          location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
          return;
        }

        if (typeof CMS === "undefined") {
          showError("Could not load the composer. Check your connection and refresh.");
          return;
        }

        CMS.init({ config_url: location.origin + "/admin/config.yml" });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (reason) showError(reason);
        });
      })();
    </script>
  </body>
</html>
