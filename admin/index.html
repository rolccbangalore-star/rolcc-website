<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ROLCC Article Composer</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      #cms-loading {
        font-family: system-ui, sans-serif;
        max-width: 28rem;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #334155;
        text-align: center;
      }
      #cms-error {
        display: none;
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 1.25rem;
        border: 1px solid #fecaca;
        border-radius: 0.75rem;
        background: #fef2f2;
        color: #991b1b;
      }
    </style>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.3.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <div id="cms-loading">
      <p>Loading ROLCC Article Composer…</p>
      <p style="font-size: 0.875rem; color: #64748b">Use <strong>www.rolcc.in/admin</strong> if login fails.</p>
    </div>
    <div id="cms-error" role="alert"></div>
    <noscript>Enable JavaScript to use the ROLCC article composer.</noscript>
    <script>
      (function () {
        var loading = document.getElementById("cms-loading");
        var errorBox = document.getElementById("cms-error");

        function showError(message) {
          if (loading) loading.style.display = "none";
          if (errorBox) {
            errorBox.style.display = "block";
            errorBox.textContent = message;
          }
        }

        if (location.pathname === "/admin" || location.pathname === "/admin/") {
          location.replace("/admin/index.html" + location.search + location.hash);
          return;
        }

        if (location.hostname === "rolcc.in") {
          location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
          return;
        }

        if (typeof CMS === "undefined") {
          showError("Could not load Decap CMS. Check your network connection and try again.");
          return;
        }

        CMS.init({ config_url: location.origin + "/admin/config.yml" });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (reason) showError("Composer failed to start: " + reason);
        });
      })();
    </script>
  </body>
</html>
