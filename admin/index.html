<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <script>
      if (location.hostname === "rolcc.in") {
        location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
      }
    </script>
    <title>Article Composer | River of Life Christian Church</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/articles.css" />
    <link rel="stylesheet" href="/admin/admin.css?v=20260707editor4" />
  </head>
  <body class="admin-page">
    <header id="admin-topbar" class="admin-shell-topbar" hidden>
      <div class="admin-topbar__left">
        <a
          href="#/collections/articles"
          id="admin-editor-back"
          class="admin-editor-back admin-editor-back--topbar"
          hidden
          aria-label="Back to collection"
          title="Back to collection"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a>
        <a href="https://www.rolcc.in/" class="admin-topbar-brand" target="_blank" rel="noopener noreferrer">
          <img
            class="admin-topbar-brand__logo"
            src="/images/favicon-96x96.png"
            alt="River of Life Christian Church"
            width="36"
            height="36"
          />
          <div class="admin-topbar-brand__text">
            <span class="admin-topbar-brand__name">River of Life Christian Church</span>
            <p class="admin-topbar-brand__sub">Article Composer</p>
          </div>
        </a>
      </div>
      <div class="admin-topbar__center">
        <div class="admin-search" id="admin-search-wrap">
          <div class="admin-search__field" id="admin-search-slot">
            <svg class="admin-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              type="search"
              id="admin-search-input"
              class="admin-search__input"
              placeholder="Search for an article"
              aria-label="Search for an article"
              autocomplete="off"
            />
          </div>
        </div>
        <div class="admin-editor-title-block" id="admin-editor-title-block" hidden>
          <input
            type="text"
            id="admin-editor-title-input"
            class="admin-editor-title-input"
            placeholder="Untitled"
            aria-label="Article title"
            autocomplete="off"
          />
          <p class="admin-editor-status" id="admin-editor-status" aria-live="polite"></p>
        </div>
      </div>
      <div class="admin-topbar__right">
        <a
          href="https://www.rolcc.in/"
          class="btn-outline admin-website-link"
          target="_blank"
          rel="noopener noreferrer"
          title="Open website"
          data-tooltip="Open website"
          aria-label="Open website"
          ><svg class="admin-website-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Website</a
        >
        <button type="button" class="btn-outline admin-import-btn" id="admin-import-btn" hidden>Import</button>
        <button type="button" class="btn-outline admin-preview-btn" id="admin-preview-btn" hidden>Preview</button>
        <button type="button" class="btn-outline admin-save-draft-btn" id="admin-save-draft-btn" hidden>Save draft</button>
        <button type="button" class="btn-outline admin-delete-btn" id="admin-delete-btn" hidden>Delete</button>
        <button type="button" class="btn-primary admin-publish-btn" id="admin-publish-btn" hidden>Publish</button>
        <div id="admin-publish-slot" class="admin-publish-slot" hidden aria-hidden="true"></div>
        <div id="admin-profile-slot" class="admin-profile-slot"></div>
      </div>
    </header>

    <aside id="admin-sidebar" class="admin-shell-sidebar" hidden>
      <div id="admin-create-slot" class="admin-sidebar-create"></div>

      <div class="admin-view-switcher admin-dropdown" id="admin-view-switcher">
        <button type="button" class="admin-view-switcher__trigger" aria-haspopup="true" aria-expanded="false">
          <svg class="admin-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span class="admin-view-switcher__label">Contents</span>
          <svg class="admin-view-switcher__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div class="admin-view-switcher__menu admin-dropdown__menu" role="menu">
          <button type="button" class="admin-view-switcher__option" data-view="contents" role="menuitem">Contents</button>
          <button type="button" class="admin-view-switcher__option" data-view="media" role="menuitem">Media</button>
        </div>
      </div>

      <p class="admin-sidebar-section-label admin-sidebar-section-label--collections">Collections</p>
      <nav class="admin-sidebar-nav admin-sidebar-nav--collections" aria-label="Article collections">
        <a href="#/collections/articles" class="admin-sidebar-link" data-collection="articles">
          <svg class="admin-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          <span class="admin-sidebar-link__text">Sermon Summary</span>
        </a>
        <a href="#/collections/bible-study" class="admin-sidebar-link" data-collection="bible-study">
          <svg class="admin-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          <span class="admin-sidebar-link__text">Back to the Bible</span>
        </a>
      </nav>

      <p class="admin-sidebar-section-label admin-sidebar-section-label--pages" hidden>Pages</p>
      <nav id="admin-media-pages-nav" class="admin-sidebar-nav admin-sidebar-nav--pages" hidden aria-label="Filter images by page"></nav>
    </aside>

    <div id="admin-media-pane" class="admin-media-pane" hidden></div>
    <div id="nc-root" class="admin-workspace"></div>
    <p id="cms-error" class="admin-error" role="alert" hidden></p>
    <noscript>
      <p class="admin-error">Enable JavaScript to use the article composer.</p>
    </noscript>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.3.0/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/immutable@4.3.6/dist/immutable.min.js"></script>
    <script src="/scripts/article-import-parse.js?v=20260707store5"></script>
    <script src="/scripts/article-render.js?v=20260707preview1"></script>
    <script src="/admin/admin-composer.js?v=20260707delete1"></script>
    <script src="/admin/admin-import.js?v=20260707delete1"></script>
    <script src="/admin/admin-preview.js?v=20260707preview1"></script>
    <script>
      (function () {
        var errorBox = document.getElementById("cms-error");

        function showError(message) {
          if (!errorBox) return;
          errorBox.hidden = false;
          errorBox.textContent = message;
        }

        if (location.pathname === "/admin" || location.pathname === "/admin/") {
          location.replace("/admin/index.html" + location.search + location.hash);
          return;
        }

        if (location.hostname === "rolcc.in") {
          location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
          return;
        }

        if (typeof CMS === "undefined") {
          showError("Could not load the composer. Check your connection and refresh.");
          return;
        }

        CMS.init({ config_url: location.origin + "/admin/config.yml" });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (reason) showError(reason);
        });
      })();
    </script>
  </body>
</html>
