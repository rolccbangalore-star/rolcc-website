    <script>window.CMS_MANUAL_INIT = true;</script>

    <script>
      (function () {
        var errorBox = document.getElementById("cms-error");

        function showError(message) {
          if (!errorBox) return;
          errorBox.hidden = false;
          errorBox.textContent = message;
        }

        function friendlyAuthError(message) {
          var text = String(message || "");
          if (/does not have access to this repo/i.test(text) || /Repo ".+" not found/i.test(text)) {
            return "Sign in with Google using an allowlisted church Gmail. You do not need a GitHub account — if this keeps appearing after Google sign-in, contact the site admin (GitHub App access).";
          }
          return text;
        }

        if (location.pathname === "/resources" || location.pathname === "/resources/") {
          location.replace("/resources/index.html" + location.search + location.hash);
          return;
        }

        if (location.hostname === "rolcc.in") {
          location.replace("https://www.rolcc.in" + location.pathname + location.search + location.hash);
          return;
        }

        if (typeof CMS === "undefined") {
          showError("Could not load the composer. Check your connection and refresh.");
          return;
        }

        // Gmail-only editors use a GitHub App installation token (ghs_). Decap's default
        // github backend still checks "collaborator push" unless we opt out + stub /user.
        (function enableGithubAppTokenSupport() {
          try {
            var GitHubBackend = typeof CMS.getBackend === "function" ? CMS.getBackend("github") : null;
            if (GitHubBackend && GitHubBackend.prototype) {
              GitHubBackend.prototype.bypassWriteAccessCheckForAppTokens = true;
            }
          } catch (err) {
            /* continue with fetch patch below */
          }

          var originalFetch = window.fetch;
          if (!originalFetch || originalFetch.__rolccGithubAppPatch) return;

          function authHeader(init, input) {
            var headers = (init && init.headers) || null;
            if (!headers && input && input.headers) headers = input.headers;
            if (!headers) return "";
            if (typeof Headers !== "undefined" && headers instanceof Headers) {
              return headers.get("Authorization") || headers.get("authorization") || "";
            }
            if (Array.isArray(headers)) {
              for (var i = 0; i < headers.length; i++) {
                if (String(headers[i][0]).toLowerCase() === "authorization") return headers[i][1] || "";
              }
              return "";
            }
            return headers.Authorization || headers.authorization || "";
          }

          function isAppToken(auth) {
            return /(?:^|\s)(ghs_|ghu_)/.test(String(auth || ""));
          }

          function requestUrl(input) {
            if (typeof input === "string") return input;
            if (input && typeof input.url === "string") return input.url;
            return "";
          }

          function jsonResponse(data, status) {
            return new Response(JSON.stringify(data), {
              status: status || 200,
              headers: { "Content-Type": "application/json" },
            });
          }

          function withBearerAppToken(input, init) {
            var auth = authHeader(init, input);
            if (!isAppToken(auth) || /\bBearer\s+(ghs_|ghu_)/i.test(auth)) {
              return { input: input, init: init };
            }
            var tokenMatch = String(auth).match(/(ghs_|ghu_)[A-Za-z0-9_]+/);
            if (!tokenMatch) return { input: input, init: init };
            var bearer = "Bearer " + tokenMatch[0];
            var nextInit = init ? Object.assign({}, init) : {};
            var headers = nextInit.headers;
            if (typeof Headers !== "undefined" && headers instanceof Headers) {
              headers = new Headers(headers);
              headers.set("Authorization", bearer);
              nextInit.headers = headers;
            } else if (Array.isArray(headers)) {
              nextInit.headers = headers
                .filter(function (pair) {
                  return String(pair[0]).toLowerCase() !== "authorization";
                })
                .concat([["Authorization", bearer]]);
            } else {
              nextInit.headers = Object.assign({}, headers || {}, { Authorization: bearer });
            }
            return { input: input, init: nextInit };
          }

          function patchedFetch(input, init) {
            var rewritten = withBearerAppToken(input, init);
            input = rewritten.input;
            init = rewritten.init;
            var url = requestUrl(input).split("?")[0];
            var auth = authHeader(init, input);
            var appToken = isAppToken(auth);

            return originalFetch.call(window, input, init).then(function (res) {
              if (!appToken) return res;

              // Installation tokens cannot call GET /user — stub a stable identity for Decap.
              if (/^https:\/\/api\.github\.com\/user$/.test(url) && !res.ok) {
                return jsonResponse(
                  {
                    login: "rolcc-resources",
                    name: "ROLCC Resources",
                    avatar_url: "https://www.rolcc.in/images/favicon-96x96.png",
                    email: null,
                  },
                  200
                );
              }

              // Ensure permissions.push so Decap's hasWriteAccess() passes when bypass is unavailable.
              if (
                /^https:\/\/api\.github\.com\/repos\/[^/]+\/[^/]+$/.test(url) &&
                res.ok
              ) {
                return res
                  .clone()
                  .json()
                  .then(function (data) {
                    if (!data || typeof data !== "object") return res;
                    data.permissions = Object.assign({}, data.permissions || {}, {
                      admin: true,
                      maintain: true,
                      push: true,
                      triage: true,
                      pull: true,
                    });
                    return jsonResponse(data, res.status);
                  })
                  .catch(function () {
                    return res;
                  });
              }

              return res;
            });
          }

          patchedFetch.__rolccGithubAppPatch = true;
          window.fetch = patchedFetch;
        })();

        CMS.init({ config_url: location.origin + "/resources/config.yml" });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (reason) showError(friendlyAuthError(reason));
        });
      })();
    </script>
